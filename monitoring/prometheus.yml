global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bairrovivo
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token   # o mesmo METRICS_TOKEN da VM
    static_configs:
      - targets: ["SEU_IP_PUBLICO_DA_VM:80"]   # <- TROQUE pelo IP (terraform output public_ip)
