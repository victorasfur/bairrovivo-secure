groups:
  - name: bairrovivo
    rules:
      - alert: BairroVivoForaDoAr
        expr: up{job="bairrovivo"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "BairroVivo não responde ao Prometheus"
          description: "O alvo {{ $labels.instance }} está fora do ar há mais de 30s."

      - alert: BairroVivoMuitosErros5xx
        expr: |
          100 * sum(rate(http_requests_total{job="bairrovivo",status="5xx"}[1m]))
              / sum(rate(http_requests_total{job="bairrovivo"}[1m])) > 5
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "Taxa de erros 5xx acima de 5%"
          description: "Mais de 5% das requisições estão falhando (erro de servidor)."

      - alert: BairroVivoLatenciaAlta
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_highr_seconds_bucket{job="bairrovivo"}[2m]))) > 1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Latência p95 acima de 1s"
          description: "95% das requisições estão demorando mais de 1 segundo."
