name: bairrovivo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bairrovivo}
      POSTGRES_DB: ${POSTGRES_DB:-bairrovivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    # sem "ports": o banco NÃO é acessível de fora da rede do compose

  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: ${APP_IMAGE:-bairrovivo:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bairrovivo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bairrovivo}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DEMO_MODE: ${DEMO_MODE:-0}
    ports:
      - "${APP_PORT:-8000}:8000"
    networks: [backend]
    # endurecimento do container
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  backend:

volumes:
  pgdata:
